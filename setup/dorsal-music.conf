# Dorsal: the computer's sound as an input named "Dorsal", for the keyboard's music modes on the
# site. Browsers do not list PipeWire's monitor sources, but they do list this one: it copies
# whatever the default output plays, and follows it when the output changes.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Dorsal"
      capture.props = {
        node.name = "dorsal_capture"
        node.description = "Dorsal"
        stream.capture.sink = true
        node.passive = true
      }
      playback.props = {
        node.name = "dorsal_computer"
        node.description = "Dorsal"
        media.class = "Audio/Source"
        audio.position = [ FL FR ]
      }
    }
  }
]
